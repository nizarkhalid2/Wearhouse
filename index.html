<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المستودع والمنتجات</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <div class="logo">📦 نظام المستودع</div>
            <nav id="nav-links">
                <span id="user-info" class="user-badge" style="display: none;"></span>
                <button id="auth-btn" class="btn btn-primary" onclick="handleAuthAction()">تسجيل الدخول</button>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <!-- Section: Auth Modal / Container -->
        <section id="auth-section" class="card auth-card" style="display: none;">
            <h2 id="auth-title">تسجيل الدخول</h2>
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" class="form-input" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div id="auth-error" class="alert alert-error" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">تسجيل الدخول</button>
            </form>
        </section>

        <!-- Admin Controls Panel (Admin Only) -->
        <section id="admin-panel" class="card admin-card" style="display: none;">
            <div class="section-header">
                <h2>🛠️ لوحة الأدمن - إضافة منتج جديد</h2>
            </div>
            <form id="add-product-form" onsubmit="handleAddProduct(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="prod-name">اسم المنتج</label>
                        <input type="text" id="prod-name" class="form-input" placeholder="مثال: آيفون 15 برو" required>
                    </div>
                    <div class="form-group">
                        <label for="prod-price">السعر ($)</label>
                        <input type="number" step="0.01" id="prod-price" class="form-input" placeholder="999.00" required>
                    </div>
                    <div class="form-group">
                        <label for="prod-stock">الكمية المتاحة</label>
                        <input type="number" id="prod-stock" class="form-input" placeholder="50" required>
                    </div>
                    <div class="form-group">
                        <label for="prod-category">التصنيف</label>
                        <input type="text" id="prod-category" class="form-input" placeholder="إلكترونيات">
                    </div>
                </div>
                <button type="submit" class="btn btn-success" id="save-prod-btn">➕ إضافة المنتج للمستودع</button>
            </form>
        </section>

        <!-- Product List Section -->
        <section class="card">
            <div class="section-header">
                <h2>📋 قائمة المنتجات</h2>
                <button class="btn btn-secondary" onclick="loadProducts()">🔄 تحديث البيانات</button>
            </div>
            <div id="loading-spinner" class="spinner" style="display: none;">جاري التحميل...</div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>اسم المنتج</th>
                            <th>التصنيف</th>
                            <th>السعر</th>
                            <th>الكمية</th>
                            <th class="admin-only" style="display: none;">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <!-- Products loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
